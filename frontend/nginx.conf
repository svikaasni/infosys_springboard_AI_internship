server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend service (see docker-compose.yml — the
    # hostname "backend" resolves via Docker's internal DNS between
    # containers on the same compose network).
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25M;
    }

    # Single-page app: any unmatched path falls back to index.html so
    # React Router's client-side routes work on a hard refresh/deep link.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
